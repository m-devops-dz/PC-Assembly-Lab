<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Assembly Lab: B450 Gaming Plus Max build</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4" fill="#1b1c1f"/><rect x="8" y="8" width="16" height="16" rx="1.5" fill="#c9ced4"/><path d="M4 28 L4 20 L12 28 Z" fill="#e8b33a"/><rect x="26" y="4" width="2" height="24" fill="#d22630"/></svg>
      <div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div>
    </div>
    <div class="head-actions">
      <div class="settings">
        <button class="chip-btn" id="setBtn" aria-expanded="false" aria-controls="setPop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="set_btn"></span></button>
        <div class="set-pop" id="setPop" hidden>
          <label class="toggle"><input type="checkbox" id="setTray"> <span data-i18n="set_tray"></span></label>
          <label class="toggle"><input type="checkbox" id="setRgb"> <span data-i18n="set_rgb"></span></label>
          <label class="toggle"><input type="checkbox" id="setQuiz"> <span data-i18n="set_quiz"></span></label>
          <label class="toggle"><input type="checkbox" id="setCard"> <span data-i18n="set_card"></span></label>
        </div>
      </div>
      <button class="chip-btn" id="offlineBtn" data-i18n="off_btn"></button>
      <div class="settings mode-menu">
        <button class="chip-btn" id="modeBtn" aria-expanded="false" aria-controls="modePop"></button>
        <div class="set-pop mode-pop" id="modePop" hidden><button data-mode="build"></button><button data-mode="trouble"></button><button data-mode="install"></button></div>
      </div>
      <button class="chip-btn" id="langBtn"></button>
      <button class="chip-btn" id="resetBtn" data-i18n="reset"></button>
    </div>
  </header>

  <div class="work">
    <aside>
      <button class="sheet-btn" id="sheetBtn" aria-controls="steps"><i aria-hidden="true"></i><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="ts" id="tsPanel" hidden></div>
      <div class="ts in" id="inPanel" hidden></div>
      <div class="lessons">
        <p class="module-title" data-i18n="lessons"></p>
        <ul class="modules" id="modules"></ul>
      </div>
      <ol class="steps" id="steps"></ol>
      <div class="explain" aria-live="polite"><h2 id="expTitle"></h2><p id="expText"></p></div>
      <label class="toggle"><input type="checkbox" id="hintChk" checked> <span data-i18n="hints"></span></label>
      <div class="stats">
        <div class="stat"><b id="mistakes">0</b><small data-i18n="mistakes"></small></div>
        <div class="stat"><b id="timer">0:00</b><small data-i18n="time"></small></div>
      </div>
      <details class="specs">
        <summary data-i18n="specs"></summary>
        <div class="spec"><b>MSI B450 GAMING PLUS MAX</b><span data-i18n="spec_board"></span></div>
        <div class="spec"><b>AMD Ryzen 5 5600G</b><span data-i18n="spec_cpu"></span></div>
        <div class="spec"><b>Asgard 8 GB DDR4-3200 (×2)</b><span data-i18n="spec_ram"></span></div>
        <div class="spec"><b>AMD Wraith Stealth</b><span data-i18n="spec_cool"></span></div>
      </details>
      <details class="photos">
        <summary data-i18n="photos"></summary>
        <p data-i18n="photosHelp"></p>
        <label class="theme-in"><span data-i18n="photoTheme"></span><input type="file" accept=".zip,application/zip" id="themeFile"></label>
        <p class="theme-name" id="themeName"></p>
        <div class="photo-btns"><button class="chip-btn" id="themeSave" data-i18n="themeSave" disabled></button><button class="chip-btn" id="photoClear" data-i18n="photoClear" disabled></button></div>
        <p data-i18n="photosOne"></p>
        <label><span data-i18n="photoBoard"></span><input type="file" accept="image/*" data-photo="board"></label>
        <label><span data-i18n="photoLid"></span><input type="file" accept="image/*" data-photo="cpuTop"></label>
        <label><span data-i18n="photoRam"></span><input type="file" accept="image/*" data-photo="ram"></label>
        <label><span data-i18n="photoM2"></span><input type="file" accept="image/*" data-photo="m2"></label>
        <label><span data-i18n="photoSata"></span><input type="file" accept="image/*" data-photo="sata"></label>
        <label><span data-i18n="photoGpu"></span><input type="file" accept="image/*" data-photo="gpu"></label>
        <label><span data-i18n="photoPsu"></span><input type="file" accept="image/*" data-photo="psu"></label>
      </details>
    </aside>

    <section class="stage">
      <div class="viewport" id="viewport">
        <div class="tools">
          <button class="tool" id="rotL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v5h5"/></svg></button>
          <button class="tool drop" id="dropBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg></button>
          <button class="tool" id="rotR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></svg></button>
          <button class="tool" id="flipBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7L3 17h5z"/><path d="M16 7l5 10h-5z" fill="currentColor"/></svg></button>
        </div>
        <div class="view-btns"><label class="bright"><span id="brightLbl"></span><input type="range" id="bright" min="0.5" max="1.8" step="0.05"></label><label class="bright"><span data-i18n="themePick"></span><select id="themeSel"></select></label><button id="glowBtn" aria-pressed="true"></button><button id="tableBtn" data-i18n="tableView"></button><button id="topBtn" data-i18n="topView"></button><button id="viewBtn" data-i18n="resetView"></button><button id="fsBtn" class="fs-btn" aria-pressed="false"></button></div>
        <div class="fs-bar" id="fsBar"><button class="fs-panel" id="panelBtn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><p class="fs-step" id="fsStep"></p><p class="fs-stats"><b id="fsMis">0</b> · <span id="fsTime">0:00</span></p></div>
        <div class="toast" id="toast" role="status"></div>
        <div class="coach" id="coach" hidden><div class="coach-head"><b data-i18n="co_title"></b><button class="coach-x" id="coachX" data-i18n="co_hide"></button></div><ol></ol></div>
        <button class="hint-btn" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span data-i18n="hintBtn"></span><b id="hintLeft">5</b></button>
        <div class="keyview" id="keyView" hidden>
          <div class="kv-faces"></div>
          <p class="kv-msg" aria-live="polite"></p>
        </div>
        <div class="psu-info" id="psuInfo" hidden></div>
        <div class="ts-float" id="tsFloat" hidden></div>
        <div class="quiz step-card" id="stepCard" hidden>
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="scTitle">
            <p class="quiz-part" id="scNum"></p>
            <h2 id="scTitle"></h2>
            <p class="sc-text" id="scText"></p>
            <button class="primary" id="scOk" data-i18n="ok"></button>
          </div>
        </div>
        <div class="quiz step-card" id="fsAsk" hidden>
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="faTitle">
            <h2 id="faTitle" data-i18n="fa_title"></h2>
            <p class="sc-text" data-i18n="fa_text"></p>
            <div class="fa-btns"><button class="primary" id="faYes" data-i18n="fa_yes"></button><button class="chip-btn" id="faNo" data-i18n="fa_no"></button></div>
          </div>
        </div>
        <div class="quiz step-card" id="verAsk" hidden>
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="vaTitle">
            <h2 id="vaTitle" data-i18n="va_title"></h2>
            <p class="sc-text" id="vaText"></p>
            <div class="fa-btns"><button class="primary" id="vaOpen" data-i18n="va_open"></button><button class="chip-btn" id="vaLater" data-i18n="va_later"></button><button class="chip-btn" id="vaNever" data-i18n="va_never"></button></div>
          </div>
        </div>
        <div class="quiz" id="quiz" hidden>
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
            <button class="quiz-x" id="quizX"><span aria-hidden="true">×</span></button>
            <p class="quiz-part" id="quizPart"></p>
            <h2 id="quizTitle" data-i18n="q_title"></h2>
            <div class="quiz-choices" id="quizChoices"></div>
            <p class="quiz-msg" id="quizMsg" aria-live="polite"></p>
          </div>
        </div>
        <div class="scr" id="scr" hidden>
          <div class="scr-frame"><div class="scr-body" id="scrBody"></div></div>
          <button class="scr-back" id="scrBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span data-i18n="scr_back"></span></button>
        </div>
        <div class="quiz step-card in-card" id="inCard" hidden>
          <div class="quiz-card" role="dialog" aria-modal="true" aria-labelledby="icTitle">
            <p class="quiz-part" id="icNum"></p>
            <h2 id="icTitle"></h2>
            <div class="sc-text" id="icText"></div>
            <div class="fa-btns" id="icBtns" hidden></div>
            <button class="primary" id="icOk" data-i18n="ok"></button>
          </div>
        </div>
        <div class="loadmsg" id="loadMsg"><div><b>Loading the 3D workbench…</b></div></div>
        <div class="done" id="done">
          <div class="done-card">
            <svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="#2f8f5b"/><path d="M16 29l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h2 data-i18n="doneTitle"></h2>
            <p id="doneText"></p>
            <button class="primary" id="againBtn" data-i18n="ok"></button>
          </div>
        </div>
      </div>
      <div class="tray">
        <div class="tray-items" id="tray"></div>
      </div>
    </section>
  </div>
</div>
<div class="red-flash" id="redFlash" aria-hidden="true"></div>

<script src="js/core/boot-errors.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="version.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/i18n-install.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/textures.js"></script>
<script src="js/core/scene.js"></script>
<script src="js/parts/desk.js"></script>
<script src="js/parts/motherboard.js"></script>
<script src="js/parts/rear-io.js"></script>
<script src="js/parts/board-headers.js"></script>
<script src="js/parts/socket.js"></script>
<script src="js/parts/dimm-slots.js"></script>
<script src="js/parts/pcie-latch.js"></script>
<script src="js/parts/cpu.js"></script>
<script src="js/parts/ram.js"></script>
<script src="js/parts/fan-headers.js"></script>
<script src="js/parts/thermal-paste.js"></script>
<script src="js/parts/cooler.js"></script>
<script src="js/parts/cables.js"></script>
<script src="js/parts/m2-ssd.js"></script>
<script src="js/parts/cmos-battery.js"></script>
<script src="js/parts/case.js"></script>
<script src="js/parts/side-panel.js"></script>
<script src="js/parts/case-fans.js"></script>
<script src="js/parts/psu.js"></script>
<script src="js/parts/gpu.js"></script>
<script src="js/parts/wifi-card.js"></script>
<script src="js/parts/sata-connectors.js"></script>
<script src="js/parts/sata-ssd.js"></script>
<script src="js/parts/connector-cables.js"></script>
<script src="js/parts/front-panel.js"></script>
<script src="js/parts/peripherals.js"></script>
<script src="js/parts/power-strip.js"></script>
<script src="js/parts/laptop.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/game/photos.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/take-parts.js"></script>
<script src="js/game/actions.js"></script>
<script src="js/game/drop.js"></script>
<script src="js/game/connectors.js"></script>
<script src="js/game/key-view.js"></script>
<script src="js/game/psu-info.js"></script>
<script src="js/game/paste.js"></script>
<script src="js/game/power.js"></script>
<script src="js/game/skip.js"></script>
<script src="js/game/input.js"></script>
<script src="js/game/ui.js"></script>
<script src="js/game/hints.js"></script>
<script src="js/game/table.js"></script>
<script src="js/game/settings.js"></script>
<script src="js/game/quiz.js"></script>
<script src="js/game/trouble.js"></script>
<script src="js/screens/screen.js"></script>
<script src="js/screens/laptop-apps.js"></script>
<script src="js/screens/pc-boot.js"></script>
<script src="js/screens/old-windows.js"></script>
<script src="js/screens/disk-mgmt.js"></script>
<script src="js/screens/win-setup.js"></script>
<script src="js/game/install.js"></script>
<script src="js/game/in-challenges.js"></script>
<script src="js/game/offline.js"></script>
<script src="js/game/version-check.js"></script>
<script src="js/game/loop.js"></script>
</body>
</html>
